blueprint:
  name: Danfoss Ally (Zigbee2MQTT) - Pause/Resume Heating On Window State
  description: 'Pauses Danfoss Ally heating when any selected open/close sensor has
    remained open for the configured time, and resumes heating once no selected
    sensors are considered open.

    This blueprint targets Zigbee2MQTT switch entities only. It controls each
    thermostat''s `window_open_external` switch and `heat_available` switch instead
    of changing the Home Assistant climate entity HVAC mode.
    Open window detected means `window_open_external = on` and `heat_available = off`,
    which marks the window as open and tells the thermostat heat is not available.
    Resume normal heating means `window_open_external = off` and `heat_available = on`,
    which clears the external window-open flag and makes heat available again.

    By default, only sensor state `on` is treated as open. Sensor states `off`,
    `unknown`, and `unavailable` are treated as not-open. This can be changed with
    the unavailable-state option below.

    Startup/reload sync is immediate when enabled. It does not wait for `open_for`
    or `close_for`; it simply evaluates the current room state and applies the corresponding
    window-open and heat-available switch states.

    '
  source_url: https://github.com/theDiverDK/HomeAssistant-Blueprints/blob/main/danfoss_ally/window_open_pause_heating.yaml
  domain: automation
  input:
    open_close_sensors:
      name: Open/Close sensors
      description: One or more binary sensors that report on/off for open/closed.
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - binary_sensor
            device_class:
            - door
            - window
          reorder: false
    thermostats_window_open:
      name: Danfoss Ally window-open controls
      description: 'Select 1..n Zigbee2MQTT switch entities for `window_open_external`
        (typically named like `switch.<trv>_window_open_external`). Any selected
        switch whose entity ID does not end with `_window_open_external` is ignored
        by the automation.

        '
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - switch
            integration: mqtt
          reorder: false
    thermostats_heat_available:
      name: Danfoss Ally heat-available controls
      description: 'Select 1..n Zigbee2MQTT switch entities for `heat_available`
        (typically named like `switch.<trv>_heat_available`). These are set to
        `off` while a window is open and back to `on` when heating should resume.
        Any selected switch whose entity ID does not end with `_heat_available`
        is ignored by the automation.

        '
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - switch
            integration: mqtt
          reorder: false
    open_for:
      name: Open duration before pause
      description: How long a sensor must stay open before heating is paused.
      default: 00:05:00
      selector:
        duration: {}
    close_for:
      name: Closed duration before resume
      description: 'How long the room must remain without any sensor considered open
        before heating resumes.

        '
      default: 00:01:00
      selector:
        duration: {}
    unavailable_behavior:
      name: Unknown/unavailable handling
      description: 'Choose whether `unknown` and `unavailable` should count as open.

        `treat_as_closed` resumes heating as long as no sensor is `on`.

        `treat_as_open` keeps heating paused until every sensor is explicitly `off`.

        '
      default: treat_as_closed
      selector:
        select:
          options:
            - label: Treat as closed
              value: treat_as_closed
            - label: Treat as open
              value: treat_as_open
    sync_on_startup:
      name: Sync state on startup/reload
      description: 'On Home Assistant startup or automation reload, immediately re-evaluate
        all selected sensors and set thermostat window-open and heat-available
        switches accordingly.
        This does not wait for `open_for` or `close_for`.

        '
      default: true
      selector:
        boolean: {}
mode: restart
max_exceeded: silent
variables:
  monitored_open_close_sensors: !input open_close_sensors
  trv_window_open_switches: !input thermostats_window_open
  trv_heat_available_switches: !input thermostats_heat_available
  valid_trv_window_open_switches: >-
    {{ trv_window_open_switches
       | select('search', '_window_open_external$')
       | list }}
  valid_trv_heat_available_switches: >-
    {{ trv_heat_available_switches
       | select('search', '_heat_available$')
       | list }}
  unavailable_behavior: !input unavailable_behavior
  startup_sync_enabled: !input sync_on_startup
trigger:
- platform: state
  id: sensor_change
  entity_id: !input open_close_sensors
- platform: homeassistant
  id: startup_sync
  event: start
- platform: event
  id: startup_sync
  event_type: automation_reloaded
action:
- condition: template
  value_template: '{{ trigger.id != ''startup_sync'' or startup_sync_enabled }}'
- choose:
  - conditions:
    - condition: trigger
      id: startup_sync
    - condition: template
      value_template: >-
        {% set open_states = ['on'] if unavailable_behavior == 'treat_as_closed'
           else ['on', 'unknown', 'unavailable'] %}
        {{ expand(monitored_open_close_sensors)
           | selectattr('state', 'in', open_states)
           | list
           | count > 0 }}
    sequence:
    - repeat:
        for_each: '{{ valid_trv_window_open_switches }}'
        sequence:
        - service: switch.turn_on
          target:
            entity_id: '{{ repeat.item }}'
    - repeat:
        for_each: '{{ valid_trv_heat_available_switches }}'
        sequence:
        - service: switch.turn_off
          target:
            entity_id: '{{ repeat.item }}'
  - conditions:
    - condition: trigger
      id: startup_sync
    sequence:
    - repeat:
        for_each: '{{ valid_trv_window_open_switches }}'
        sequence:
        - service: switch.turn_off
          target:
            entity_id: '{{ repeat.item }}'
    - repeat:
        for_each: '{{ valid_trv_heat_available_switches }}'
        sequence:
        - service: switch.turn_on
          target:
            entity_id: '{{ repeat.item }}'
  - conditions:
    - condition: template
      value_template: >-
        {% set open_states = ['on'] if unavailable_behavior == 'treat_as_closed'
           else ['on', 'unknown', 'unavailable'] %}
        {{ expand(monitored_open_close_sensors)
           | selectattr('state', 'in', open_states)
           | list
           | count > 0 }}
    sequence:
    - delay: !input open_for
    - condition: template
      value_template: >-
        {% set open_states = ['on'] if unavailable_behavior == 'treat_as_closed'
           else ['on', 'unknown', 'unavailable'] %}
        {{ expand(monitored_open_close_sensors)
           | selectattr('state', 'in', open_states)
           | list
           | count > 0 }}
    - repeat:
        for_each: '{{ valid_trv_window_open_switches }}'
        sequence:
        - service: switch.turn_on
          target:
            entity_id: '{{ repeat.item }}'
    - repeat:
        for_each: '{{ valid_trv_heat_available_switches }}'
        sequence:
        - service: switch.turn_off
          target:
            entity_id: '{{ repeat.item }}'
  default:
  - delay: !input close_for
  - condition: template
    value_template: >-
      {% set open_states = ['on'] if unavailable_behavior == 'treat_as_closed'
         else ['on', 'unknown', 'unavailable'] %}
      {{ expand(monitored_open_close_sensors)
           | selectattr('state', 'in', open_states)
           | list
           | count == 0 }}
  - repeat:
      for_each: '{{ valid_trv_window_open_switches }}'
      sequence:
      - service: switch.turn_off
        target:
          entity_id: '{{ repeat.item }}'
  - repeat:
      for_each: '{{ valid_trv_heat_available_switches }}'
      sequence:
      - service: switch.turn_on
        target:
          entity_id: '{{ repeat.item }}'
